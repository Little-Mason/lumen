name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    # PR 上的 CI 成功不触发发布；只有 main 的 CI 成功才发
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 迁移与业务发布解耦：先改库，再发版本，保证向前兼容
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prisma db execute --file prisma/sql/000_extensions.sql --schema prisma/schema.prisma
      - run: npx prisma migrate deploy
      - run: npx prisma db execute --file prisma/sql/001_pgvector.sql --schema prisma/schema.prisma

      # 平台部署二选一（在仓库 Secrets 里配好其一即可）：
      # Vercel: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
      # Railway: railway up --service lumen -- ${{ secrets.RAILWAY_TOKEN }}
      - name: Post-deploy health check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}/api/health" || true)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            echo "attempt $i: $code"; sleep 10
          done
          echo "health check failed - rollback to previous image tag"; exit 1
