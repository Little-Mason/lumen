services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lumen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    # 本机 5432 已被原生 PostgreSQL 占用，容器内库映射到 5433 避免冲突。
    ports:
      - '5433:5432'
    volumes:
      - lumen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumen -d lumen']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lumen-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - lumen-redisdata:/data

  # 整站容器化：与 CI 产出的镜像同一份 Dockerfile，用 profile 显式开启。
  # 启动：docker compose --profile app up -d --build
  # 本机 dev server 占用 3000，因此映射到 3100；健康检查失败会如实标记 unhealthy。
  app:
    profiles: ['app']
    build: .
    image: lumen:local
    container_name: lumen-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lumen:lumen@db:5432/lumen?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    ports:
      - '3100:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.mjs']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  lumen-pgdata:
  lumen-redisdata:
